# Base settings
ApiVersion=v1.0
serviceRootUrl=http://localhost:8080/FROST-Server
queueLoggingInterval=1000

#Datamodel plugins
plugins.plugins=de.fraunhofer.iosb.ilt.frostserver.plugin.opencitysense.PluginOpenCitySense
plugins.coreModel.enable=true
plugins.multiDatastream.enable=false
plugins.actuation.enable=false

# MQTT settings
mqtt.mqttServerImplementationClass=de.fraunhofer.iosb.ilt.sensorthingsserver.mqtt.moquette.MoquetteMqttServer
mqtt.Enabled=true
mqtt.Port=1883
mqtt.QoS=0
mqtt.SubscribeMessageQueueSize=10000
mqtt.SubscribeThreadPoolSize=5
mqtt.CreateMessageQueueSize=100
mqtt.CreateThreadPoolSize=10
mqtt.Host=0.0.0.0
mqtt.internalHost=localhost
mqtt.WebsocketPort=9876
mqtt.WaitForEnter=true
mqtt.session_timeout_seconds=60
mqtt.session.timeout.seconds=30

# bus settings
bus.busImplementationClass=de.fraunhofer.iosb.ilt.sta.messagebus.MqttMessageBus
bus.mqttBroker=tcp://127.0.0.1:1885
bus.maxInFlight=2000
bus.recvQueueSize=10000


# persistence settings
persistence.persistenceManagerImplementationClass=de.fraunhofer.iosb.ilt.frostserver.persistence.pgjooq.imp.PostgresPersistenceManagerLong
persistence.autoUpdateDatabase=false
persistence.alwaysOrderbyId=false
persistence.db.driver=org.postgresql.Driver
persistence.db.url=jdbc:postgresql://localhost:6543/sensorthings
persistence.db.username=sensorthings
persistence.db.password=ChangeMe

# auth settings
#auth.provider=de.fraunhofer.iosb.ilt.frostserver.auth.keycloak.KeycloakAuthProvider
auth.allowAnonymousRead=true
auth.role.read=read
auth.role.create=create
auth.role.update=update
auth.role.delete=delete
auth.role.admin=admin

