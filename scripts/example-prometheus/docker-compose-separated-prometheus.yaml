name: frost_server
services:
  nginx:
    image: nginx:1-alpine
    ports:
      - "80:80"
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
#      - "./htpasswd:/etc/nginx/htpasswd:ro"
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frosthttp:
    image: fraunhoferiosb/frost-server-http:latest
#    ports:
#      - 8080:8080
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      # For all settings see: https://fraunhoferiosb.github.io/FROST-Server/settings/settings.html
      - serviceRootUrl=http://${external_ip}:80/FROST-Server
      - mqtt_exposedEndpoints=ws://${external_ip}:80/mqtt
      - queueLoggingInterval=1000
      - plugins.multiDatastream.enable=true
      - http_cors_enable=true
      - http_cors_allowed_origins=*
      - bus_busImplementationClass=de.fraunhofer.iosb.ilt.sta.messagebus.MqttMessageBus
      - bus_mqttBroker=tcp://mosquitto:1883
      - bus_sendQueueSize=2000
      - bus_sendWorkerPoolSize=10
      - bus_maxInFlight=2000
      - persistence_db_driver=org.postgresql.Driver
      - persistence_db_url=jdbc:postgresql://database:5432/sensorthings
      - persistence_db_username=sensorthings
      - persistence_db_password=ChangeMe
      - persistence_autoUpdateDatabase=true
      - metrics_useInternalHttpServer=true

  frostmqtt:
    image: fraunhoferiosb/frost-server-mqtt:latest
    ports:
      - 1883:1883
#      - 9876:9876
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      # For all settings see: https://fraunhoferiosb.github.io/FROST-Server/settings/settings.html
      - serviceRootUrl=http://${external_ip}:8080/FROST-Server
      - queueLoggingInterval=1000
      - plugins.multiDatastream.enable=true
      - bus_busImplementationClass=de.fraunhofer.iosb.ilt.sta.messagebus.MqttMessageBus
      - bus_mqttBroker=tcp://mosquitto:1883
      - mqtt_CreateThreadPoolSize=10
      - mqtt_CreateMessageQueueSize=10000
      - mqtt_SubscribeThreadPoolSize=20
      - mqtt_SubscribeMessageQueueSize=10000
      - persistence_persistenceManagerImplementationClass=de.fraunhofer.iosb.ilt.sta.persistence.postgres.PostgresPersistenceManager
      - persistence_db_driver=org.postgresql.Driver
      - persistence_db_url=jdbc:postgresql://database:5432/sensorthings
      - persistence_db_username=sensorthings
      - persistence_db_password=ChangeMe
      - metrics_useInternalHttpServer=true

  mosquitto:
    image: eclipse-mosquitto
    volumes:
      - "./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"

  database:
    image: postgis/postgis:16-3.4-alpine
    environment:
      - POSTGRES_DB=sensorthings
      - POSTGRES_USER=sensorthings
      - POSTGRES_PASSWORD=ChangeMe
    volumes:
      - postgis_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sensorthings -U sensorthings "]
      interval: 2s
      timeout: 2s
      retries: 10

  prometheus:
    image: prom/prometheus
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
      - prometheus_volume:/prometheus
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana
    volumes:
      - grafana_volume:/var/lib/grafana
#    ports:
#      - "3000:3000"
    environment:
      - GF_SERVER_ROOT_URL=http://${external_ip}:80/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel
      - GF_SECURITY_ADMIN_USER=grafana

volumes:
    postgis_volume: {}
    grafana_volume: {}
    prometheus_volume: {}

